<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASIS Application Form</title>
    <link rel="stylesheet" href="application.css">
</head>
<body>
    <div class="form-container">
        <h2>ASIS Application Form</h2>
        <form id="applicationForm" method="POST" action="/submit">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>

            <label for="major">Major</label>
            <input type="text" id="major" name="major" required>

            <label for="year">Year</label>
            <select id="year" name="year" required>
                <option value="">Select Year</option>
                <option value="Freshman">Freshman</option>
                <option value="Sophomore">Sophomore</option>
                <option value="Junior">Junior</option>
                <option value="Senior">Senior</option>
                <option value="Graduate">Graduate</option>
            </select>

            <label for="why">Why do you want to join ASIS?</label>
            <textarea id="why" name="why" rows="4" required></textarea>

            <button type="submit">Submit Application</button>
        </form>
    </div>
</body>
</html>
